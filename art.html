<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xintong's Design Portfolio</title>
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html" class="nav__logo" aria-label="Home">
          <img src="assets/logo.png" alt="Xintong Lin logo">
        </a>
        <ul class="nav__links">
          <li><a href="index.html#work">Work</a></li>
          <li><a href="art.html" class="nav__link--active" aria-current="page">Art</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="https://drive.google.com/file/d/18TPc3mJHjs6lvnnvbrQjFrKY6BbmmnCj/view?usp=sharing" target="_blank" rel="noopener noreferrer">Resume</a></li>
        </ul>
      </nav>
      <div class="nav-divider"><hr></div>
    </header>

    <main class="art">
      <div class="art__intro">
        <h1 class="art__title">Welcome to my art gallery</h1>
        <p class="art__subtitle">I love drawing in my free time and enjoy sharing stories behind my artwork, often inspired by people, everyday life, and personal experiences</p>
      </div>

      <div class="art__grid">
        <div class="art__row art__row--2 art__row-1">
          <div class="art__image"><img src="assets/art-tulips.png" alt="Oil painting of yellow tulips in a glass vase"></div>
          <div class="art__image"><img src="assets/art-lake.png" alt="Oil painting of a misty lake at sunrise with mountains"></div>
        </div>

        <div class="art__row art__row--2 art__row-2">
          <div class="art__image"><img src="assets/art-girl.png" alt="Watercolor illustration of a girl in a polka dot dress"></div>
          <div class="art__image"><img src="assets/art-actone.png" alt="Hyperrealistic painting of figs on a book titled Act One"></div>
        </div>

        <div class="art__row art__row--2 art__row-3">
          <div class="art__image"><img src="assets/art-bubbletea.png" alt="Marker illustration of a bubble tea shop storefront"></div>
          <div class="art__image"><img src="assets/art-cake.png" alt="Watercolor painting of a strawberry cake slice and a donut"></div>
        </div>

        <div class="art__row art__row--3 art__row-4">
          <div class="art__image"><img src="assets/art-eye.png" alt="Pencil sketch of a statue's eye"></div>
          <div class="art__image"><img src="assets/art-shapes.png" alt="Pencil sketch of geometric still life shapes"></div>
          <div class="art__image"><img src="assets/art-flower.png" alt="Pencil sketch of a flower in a glass jar"></div>
        </div>

        <div class="art__row art__row--3 art__row-5">
          <div class="art__image"><img src="assets/art-perfume.png" alt="Pencil sketch of a perfume bottle still life with apples"></div>
          <div class="art__image"><img src="assets/art-bust.png" alt="Pencil sketch of a sculpture bust"></div>
          <div class="art__image"><img src="assets/art-teapot.png" alt="Pencil sketch of a teapot still life"></div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <hr class="footer__divider">
      <div class="footer__content">
        <div class="footer__top">
          <p class="footer__heading">Thanks for visiting!</p>
          <div class="footer__social">
            <a href="https://www.linkedin.com/in/xintong-lin-930272238/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
              <img class="icon-linkedin" src="assets/icon-linkedin.png" alt="">
            </a>
            <a href="mailto:xl966@cornell.edu" aria-label="Email">
              <img class="icon-email" src="assets/icon-email.png" alt="">
            </a>
          </div>
        </div>
        <div class="footer__bottom">
          <p>Lets keep in touch :)</p>
          <p class="footer__copyright">Copyright © 2026 Xintong Lin</p>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
